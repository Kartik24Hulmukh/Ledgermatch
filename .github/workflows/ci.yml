name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python version
        run: python3 --version
      - name: Verify release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/verify_release.py
