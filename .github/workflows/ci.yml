name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python version
        run: python3 --version
      - name: Verify release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/verify_release.py
